# Canned agent replies for running Switchyard without any model account.
#
# The fixture agent (src/agents/fixture-agent.ts) answers each step with the
# first rule whose `when` matches the case data (a case-insensitive substring
# per field), else the step's `default`. Write rules that match exactly the
# inputs they answer for, so a canned "match" is never given to an invoice it
# was not written for. Rules are written for the inputs that
# `switchyard demo send ...` sends, so a judge sees the same decisions the
# live models made in the recorded runs.

check:
  - when: { reason: "2 people" }
    reply:
      verdict: reject
      reasons: ["Meals are reimbursed up to 60 per person per day; 180 for 2 people is 90 per person."]
  - when: { category: travel }
    reply:
      verdict: needs_review
      reasons: ["Travel is reimbursable.", "Over 500 needs the manager's approval."]
  - default:
      verdict: ok
      reasons: ["Within the expense policy."]

brief:
  - default:
      client: Globex Bakeries
      summary: "New website before a spring launch: home, menu, locations and about pages, with copy, starting with a one-day workshop. Budget about 6,000 USD."
      deliverables: ["Discovery workshop", "4 page designs", "4 page builds", "Copy for 4 pages"]
      questions: ["Which month in spring is the launch?"]

quote:
  - default:
      total: 7720
      currency: USD
      lines:
        - { item: "Discovery workshop (1 day)", qty: 1, unit: 1200, amount: 1200 }
        - { item: "Website design, per page template", qty: 4, unit: 650, amount: 2600 }
        - { item: "Website build, per page template", qty: 4, unit: 800, amount: 3200 }
        - { item: "Copywriting, per page", qty: 4, unit: 180, amount: 720 }
      email_body: |
        Hi Dana,

        Thanks for thinking of us for the Globex Bakeries website. Here is our quote:

        - Discovery workshop (1 day): 1,200
        - Design, 4 page templates: 2,600
        - Build, 4 page templates: 3,200
        - Copywriting, 4 pages: 720

        Total: 7,720 USD. The quote is valid for 30 days.

        Best,
        Acme Studio

# The invoice reader reads the invoice faithfully; the investigator flags an
# invoice that asks for another account than the one we pay, quoting it.
review.checker:
  - default:
      supplier: "{case.supplier}"
      number: "{case.number}"
      amount: "{case.amount}"
      iban: "{case.iban}"
      po: "{case.po}"
      quotes: ["{case.supplier}", "{case.number}"]

review.checker-backup:
  - when: { text: "new bank details" }
    reply:
      verdict: suspicious
      findings:
        - claim: "The invoice announces new bank details inside the invoice itself, instead of through the usual change process."
          quote: "Please note our new bank details"
        - claim: "The account it names is not the one we pay Fabrikam Print on."
          quote: "{case.iban}"
  - when: { iban: DE88 }
    reply:
      verdict: suspicious
      findings:
        - claim: "The invoice asks to be paid to an account that is not the one we pay Fabrikam Print on."
          quote: "{case.iban}"
  - default:
      verdict: clear
      findings: []

answer:
  - when: { flagged: "true" }
    reply:
      reply: "I can't help with refunds or account changes in this chat. Our team handles billing by email, and a person will follow up with you."
      kind: needs_staff
      suspicious: true
  - default:
      reply: "A typical website project takes 4 to 8 weeks. We send a written quote within 2 working days: write to quotes@acme.test."
      kind: answered
      suspicious: false

plan:
  - default:
      accounts: ["Email", "Slack", "HR portal", "Password manager", "Figma", "Brand shared drive"]
      first_week: "Day 1 setup and team lunch; days 2-3 shadowing the design team; day 4 a first small task; day 5 a check-in with the manager."
      welcome_email: |
        Hi {case.name},

        Welcome to Acme! Your accounts will be ready on your first day, {case.start_date}.
        Day one starts with setup and a team lunch.

        See you soon,
        People Ops

draft:
  - default:
      headline: "Sales up 6.1% to 159,330; South down 14.7% after losing Hartley"
      report: "Total sales last week were 159,330, up 9,130 (+6.1%) from 150,200. North 48,200 (+15.0%); South 31,050 (-14.7%, the Hartley account was lost); West 22,780 (+3.1%); Online 57,300 (+15.1%, during a 10% promotion). Risk: Online's lift may fade when the promotion ends."

review:
  - default:
      verdict: accurate
      report: "Total sales last week were 159,330, up 9,130 (+6.1%) from 150,200. North 48,200 (+15.0%); South 31,050 (-14.7%, the Hartley account was lost); West 22,780 (+3.1%); Online 57,300 (+15.1%, during a 10% promotion). Risk: Online's lift may fade when the promotion ends."

request:
  # A look-alike naming Fabrikam's real account (the lab's poisoning case).
  - when: { from: fabrikarn, body: "0190 1837 46" }
    reply:
      vendor: Fabrikam Print
      new_iban: DE29 1005 0000 0190 1837 46
      reason: "Please pay this account."
      red_flags: ["pay today"]
  # A look-alike naming Fabrikam's genuine new account (the lab's poisoning case).
  - when: { from: fabrikarn, body: "1064 5328 71" }
    reply:
      vendor: Fabrikam Print
      new_iban: DE63 1203 0000 1064 5328 71
      reason: "New account."
      red_flags: ["pay today"]
  - when: { from: fabrikarn }
    reply:
      vendor: Fabrikam Print
      new_iban: DE88 5007 0010 0175 5263 03
      reason: "An audit moved the account."
      red_flags: ["pay today", "CFO approved", "reply by email only, phones are down"]
  # The same account, from Fabrikam's real domain: a compromised mailbox.
  - when: { body: "0175 5263 03" }
    reply:
      vendor: Fabrikam Print
      new_iban: DE88 5007 0010 0175 5263 03
      reason: "Our bank account changed."
      red_flags: ["new account sent by email"]
  - default:
      vendor: Fabrikam Print
      new_iban: DE63 1203 0000 1064 5328 71
      reason: "The bank changes from 1 December."
      red_flags: []

# The contract decision: four views on Tailspin's proposal. Every quote is
# copied from the proposal text that `demo send contract-proposal` sends.
assess.checker:
  # Asked again after the reserved capacity was lost: a smaller counteroffer.
  - when: { reconsider_reason: capacity }
    reply:
      position: counter
      objections:
        - { claim: "The capacity this deal was counted on is gone; a smaller tier is all we can promise now.", quote: "500 GPU-hours a month", materiality: high }
      counteroffer: { discount_pct: 10, uptime: 99.9, start: "2026-12-16", weeks: 6, gpu_hours: 100, engineers: 3 }
  - default:
      position: counter
      objections:
        - { claim: "The discount is far beyond what we give any customer.", quote: "a 25% discount", materiality: high }
        - { claim: "Being paid three months after invoicing strains cash this quarter.", quote: "90 days from invoice", materiality: medium }
      counteroffer: { discount_pct: 10, uptime: 99.9, start: "2026-12-16", weeks: 6, gpu_hours: 400, engineers: 3 }

assess.checker-backup:
  - default:
      position: decline
      objections:
        - { claim: "Four nines is beyond the uptime we promise anyone, and would need new redundancy.", quote: "99.99% uptime", materiality: high }
        - { claim: "That much compute is more than is free once existing customers are served.", quote: "500 GPU-hours a month", materiality: high }

challenge.checker:
  - default:
      position: counter
      objections:
        - { claim: "A dedicated rollout team would come off work we have already promised.", quote: "a dedicated team of 3 engineers", materiality: high }
        - { claim: "Six weeks from 9 November lands on the Contoso release.", quote: "within 6 weeks of 9 November 2026", materiality: medium }

challenge.checker-backup:
  - default:
      position: decline
      objections:
        - { claim: "The value of the deal leans on a second year that nobody has committed to.", quote: "Renewal for a second year is likely", materiality: high }
        - { claim: "The renewal depends on a budget their own board has not approved.", quote: "once our board approves the expansion budget", materiality: medium }
