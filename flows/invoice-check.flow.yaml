flow: invoice-check
room: finance
description: Supplier invoice check
once_per: [case.supplier, case.number]
inlet:
  webhook:
    secret_env: INVOICE_HOOK_SECRET
    map: { supplier: invoice.supplier, number: invoice.number, amount: invoice.total, po: invoice.po_number, iban: invoice.iban }
steps:
  # Two checkers on different vendors work independently: four eyes, no
  # shared blind spot. A payment is automatic only when both say "match".
  - id: match
    parallel: ["@checker", "@checker-backup"]
    ask: >-
      Match this invoice against the purchase orders document in this room.
      Say whether the PO exists, whether the amount matches it, and why not.
    expect:
      result: [match, mismatch, no_po]
      po_amount: number?
      reasons: list
    sla: 10m

  # The decision rests on code, not on the models: the purchase order is
  # looked up in the room's document and compared to the invoice exactly.
  - id: po_check
    verify: { check: po_lookup, doc: purchase-orders, po: "{case.po}", supplier: "{case.supplier}", amount: "{case.amount}" }

  # Where the money goes is decided by the vendor master in this room, never
  # by the account printed on an invoice.
  - id: bank_check
    verify: { check: vendor_bank, doc: vendor-master, vendor: "{case.supplier}", iban: "{case.iban}" }

  - id: finance
    when: po_check.ok == false or match.agreed == false or bank_check.ok == false or bank_check.recent == true or case.amount > 10000
    gate:
      approver: "@controller"
      backup: "@cfo"
      title: "pay {case.supplier} invoice {case.number} for {case.amount}?"
      options: [pay, dispute]
      deadline: 1d
      approves: [schedule_payment]

  # The PO is marked in the room before any money moves. Another case that
  # checked the same PO sees its row change before it acts: its approval no
  # longer counts, and its PO check runs again and fails. A second invoice
  # for the same order, under any number, is never paid automatically.
  - id: reserve_po
    when: finance != "dispute" and bank_check.iban != null and bank_check.attested != false and po_check.open == true
    auto_approve: true
    outlet:
      document:
        room: finance
        name: purchase-orders
        row: ["{po_check.po}", "{po_check.supplier}", "{po_check.amount_text}", "invoiced {case.number} (case {this.id})"]

  # Paid through the bank with the case as idempotency key, then read back.
  # Never to a vendor row changed in the room outside a case, even if a
  # person clicks pay: that account is not one any case approved.
  - id: schedule_payment
    when: finance != "dispute" and bank_check.iban != null and bank_check.attested != false
    auto_approve: po_check.ok == true and match.agreed == true and bank_check.ok == true and bank_check.recent == false and case.amount <= 10000
    outlet:
      pay: { payee: "{bank_check.vendor}", to: "{bank_check.iban}", amount: "{case.amount}", currency: EUR, reference: "{case.number}" }
