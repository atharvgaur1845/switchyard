<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchyard</title>
<link rel="icon" href="/static/logo.svg">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/console.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#command"><img src="/static/logo.svg" alt="" width="22" height="22" class="logo"> Switchyard <span class="brand-sub">decision control</span></a>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-view="command" aria-selected="true">Command</button>
    <button role="tab" data-view="decisions" aria-selected="false">Decisions</button>
    <button role="tab" data-view="commitments" aria-selected="false">Commitments</button>
    <button role="tab" data-view="cases" aria-selected="false">Cases</button>
    <button role="tab" data-view="investigations" aria-selected="false">Investigations <span class="n" id="ig-count" hidden></span></button>
    <button role="tab" data-view="agents" aria-selected="false">Agents</button>
    <button role="tab" data-view="proofs" aria-selected="false">Proofs</button>
    <button role="tab" data-view="lab" aria-selected="false">Attack lab</button>
    <button role="tab" data-view="flows" aria-selected="false">Flows</button>
  </nav>
  <span class="live" id="live"><span class="dot"></span><span id="live-text">Connecting…</span></span>
</header>

<main id="view-command" class="cc-view" aria-live="polite">
  <div class="cc-loading"><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:320px"></div></div>
</main>

<section class="kpis" id="kpis" aria-label="Summary" hidden></section>

<main id="view-cases" class="cases-view" hidden>
  <aside class="list card" aria-label="Cases">
    <div class="list-tools">
      <div class="chips" id="filters" role="radiogroup" aria-label="Show"></div>
      <input id="search" type="search" placeholder="Search cases" aria-label="Search cases">
    </div>
    <ol id="case-list" class="case-list">
      <li style="padding:10px"><div class="skeleton" style="height:44px"></div></li>
      <li style="padding:10px"><div class="skeleton" style="height:44px"></div></li>
      <li style="padding:10px"><div class="skeleton" style="height:44px"></div></li>
    </ol>
  </aside>
  <article class="detail card" id="detail" aria-live="polite"></article>
</main>

<main id="view-investigations" class="ig-view" hidden aria-live="polite"></main>
<main id="view-decisions" class="pf-view" hidden></main>
<main id="view-commitments" class="pf-view" hidden></main>
<main id="view-agents" class="ag-view" hidden></main>
<main id="view-proofs" class="pf-view" hidden></main>
<main id="view-lab" class="lab-view" hidden></main>
<main id="view-replay" class="rp-view" hidden></main>

<main id="view-flows" class="flows-view" hidden>
  <div id="flow-grid" class="flow-grid"></div>
</main>

<template id="empty-detail">
  <div class="empty-state">
    <img src="/static/logo.svg" alt="" width="40" height="40">
    <h2>No case selected</h2>
    <p>Cases arrive from forms, email, schedules, webhooks and the front desk. Pick one to see its track, who did what, and what was approved.</p>
  </div>
</template>

<script src="/static/app.js" type="module"></script>
</body>
</html>
